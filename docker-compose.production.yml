version: '3.8'

services:
  app:
    image: ghcr.io/galaxyxieyu/image-this:latest
    container_name: imagine-this-app
    restart: unless-stopped
    ports:
      - "34123:3000"  # 映射到现有端口 34123
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/app.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://38.76.197.25:34123}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      # 数据持久化 - SQLite 数据库
      - ./data:/app/data
      # 数据持久化 - 上传文件
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
