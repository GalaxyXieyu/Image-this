name: Deploy to Production (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

# 添加权限配置
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://image.bojie.store

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/image-this
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/data/Image-this
            bash scripts/deploy-docker.sh

      - name: Verify deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          curl -f http://image.bojie.store/api/health || exit 1
          echo "Deployment verification successful!"

      - name: Notify deployment success
        if: success()
        run: |
          echo "=========================================="
          echo "   🎉 Deployment Successful!"
          echo "=========================================="
          echo "Service URL: http://image.bojie.store"
          echo "Health Check: http://image.bojie.store/api/health"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "=========================================="
          echo "   ❌ Deployment Failed"
          echo "=========================================="
          echo "Please check the logs above for details."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
