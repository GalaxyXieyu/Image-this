name: Deploy to Production (Standalone)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ROOT: /root/data/Image-this
  APP_DOMAIN: http://image.bojie.store
  APP_NAME: imagine-this-web
  PORT: '34123'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://image.bojie.store

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Prepare build environment
        run: |
          cat > .env.production <<'EOF'
          DATABASE_URL=file:./data/app.db
          NEXTAUTH_URL=http://image.bojie.store
          NEXTAUTH_SECRET=build-only-secret-with-32-characters
          EOF

      - name: Build standalone bundle
        env:
          DATABASE_URL: file:./data/app.db
          NEXTAUTH_URL: http://image.bojie.store
          NEXTAUTH_SECRET: build-only-secret-with-32-characters
        run: npm run build

      - name: Package deployment bundle
        run: |
          set -euxo pipefail
          rm -rf .deploy-bundle
          mkdir -p .deploy-bundle/node_modules

          rsync -a .next/standalone/ .deploy-bundle/
          rsync -a prisma .deploy-bundle/prisma
          rsync -a ecosystem.production.config.js .deploy-bundle/ecosystem.production.config.js
          rsync -a package.json .deploy-bundle/package.json

          rm -rf .deploy-bundle/node_modules/prisma .deploy-bundle/node_modules/@prisma .deploy-bundle/node_modules/.prisma .deploy-bundle/node_modules/.bin
          rsync -a node_modules/prisma/ .deploy-bundle/node_modules/prisma/
          rsync -a node_modules/@prisma/ .deploy-bundle/node_modules/@prisma/
          if [ -d node_modules/.prisma ]; then
            rsync -a node_modules/.prisma/ .deploy-bundle/node_modules/.prisma/
          fi
          if [ -d node_modules/.bin ]; then
            mkdir -p .deploy-bundle/node_modules/.bin
            rsync -a node_modules/.bin/prisma .deploy-bundle/node_modules/.bin/prisma
          fi

          tar -czf image-this-${GITHUB_SHA}.tar.gz -C .deploy-bundle .
          ls -lh image-this-${GITHUB_SHA}.tar.gz

      - name: Upload deployment bundle via rsync over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          rsync -avz --progress -e "ssh -i ~/.ssh/id_deploy -p $SERVER_PORT -o StrictHostKeyChecking=yes" \
            image-this-${GITHUB_SHA}.tar.gz scripts/deploy-standalone.sh \
            ${SERVER_USER}@${SERVER_HOST}:${APP_ROOT}/
          rm -f ~/.ssh/id_deploy

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 30m
          script: |
            mkdir -p ${{ env.APP_ROOT }}/scripts ${{ env.APP_ROOT }}/shared/data ${{ env.APP_ROOT }}/shared/public/uploads ${{ env.APP_ROOT }}/releases ${{ env.APP_ROOT }}/backups
            chmod +x ${{ env.APP_ROOT }}/deploy-standalone.sh
            cd ${{ env.APP_ROOT }}
            bash deploy-standalone.sh "${{ github.sha }}" "${{ env.APP_ROOT }}/image-this-${{ github.sha }}.tar.gz"

      - name: Verify deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          curl -f ${{ env.APP_DOMAIN }}/api/health
          echo "Deployment verification successful!"

      - name: Notify deployment success
        if: success()
        run: |
          echo "=========================================="
          echo "   🎉 Deployment Successful!"
          echo "=========================================="
          echo "Service URL: ${{ env.APP_DOMAIN }}"
          echo "Health Check: ${{ env.APP_DOMAIN }}/api/health"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "=========================================="
          echo "   ❌ Deployment Failed"
          echo "=========================================="
          echo "Please check the logs above for details."
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
