name: Build And Publish Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($packageJson.version)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Git tag ${{ github.ref_name }} does not match package.json version $($packageJson.version)"
          }

      - name: Setup environment
        shell: pwsh
        run: |
          @"
          DATABASE_URL=file:./data/app.db
          NEXTAUTH_URL=http://localhost:23000
          NEXTAUTH_SECRET=your-production-secret-key-min-32-chars
          DESKTOP_UPDATE_BASE_URL=https://bojie.store
          "@ | Set-Content .env.production

      - name: Build Windows App
        run: npm run build:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          retention-days: 30

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-electron

      - name: Show downloaded artifacts
        run: ls -lah dist-electron

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare remote update directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p "/data/imagine-this-updates/windows"

      - name: Sync desktop update artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist-electron/latest.yml,dist-electron/ImagineThis-*-Setup.exe,dist-electron/ImagineThis-*-Setup.exe.blockmap,dist-electron/ImagineThis-*-Portable.exe"
          target: "/data/imagine-this-updates/windows"
          overwrite: true
          strip_components: 1

      - name: Verify remote desktop update feed
        run: |
          curl --fail --show-error --location "https://bojie.store/api/desktop-updates/windows/latest.yml"
