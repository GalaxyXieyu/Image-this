name: Deploy to Production (Standalone)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  APP_ROOT: /root/data/Image-this
  APP_DOMAIN: http://image.bojie.store
  APP_NAME: imagine-this-web
  PORT: '34123'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://image.bojie.store

    steps:
      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then
            missing+=("SERVER_HOST")
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            missing+=("SERVER_USER")
          fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            missing+=("SERVER_SSH_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Prepare build environment
        run: |
          cat > .env.production <<'EOF'
          DATABASE_URL=file:./data/app.db
          NEXTAUTH_URL=http://image.bojie.store
          NEXTAUTH_SECRET=build-only-placeholder-do-not-use-in-production
          EOF

      - name: Build standalone bundle
        env:
          DATABASE_URL: file:./data/app.db
          NEXTAUTH_URL: http://image.bojie.store
          NEXTAUTH_SECRET: build-only-placeholder-do-not-use-in-production
        run: npm run build

      - name: Package deployment bundle
        run: |
          set -euxo pipefail
          rm -rf .deploy-bundle
          mkdir -p .deploy-bundle/node_modules

          rsync -a .next/standalone/ .deploy-bundle/
          rsync -a prisma .deploy-bundle/prisma
          rsync -a config/ecosystem.production.config.js .deploy-bundle/ecosystem.production.config.js
          rsync -a package.json .deploy-bundle/package.json

          rm -rf .deploy-bundle/node_modules
          if [ -d .next/standalone/node_modules ]; then
            cp -a .next/standalone/node_modules .deploy-bundle/
          else
            mkdir -p .deploy-bundle/node_modules
          fi

          rm -rf .deploy-bundle/node_modules/prisma .deploy-bundle/node_modules/@prisma .deploy-bundle/node_modules/.prisma .deploy-bundle/node_modules/.bin
          rsync -a node_modules/prisma/ .deploy-bundle/node_modules/prisma/
          rsync -a node_modules/@prisma/ .deploy-bundle/node_modules/@prisma/
          if [ -d node_modules/.prisma ]; then
            rsync -a node_modules/.prisma/ .deploy-bundle/node_modules/.prisma/
          fi
          if [ -d node_modules/.bin ]; then
            mkdir -p .deploy-bundle/node_modules/.bin
            rsync -a node_modules/.bin/prisma .deploy-bundle/node_modules/.bin/prisma
          fi

          if [ -d .deploy-bundle/node_modules/@prisma/@prisma ]; then
            rm -rf .deploy-bundle/node_modules/@prisma/@prisma
          fi
          if [ -d .deploy-bundle/node_modules/prisma/prisma ]; then
            tmp_prisma_dir="$(mktemp -d)"
            cp -a .deploy-bundle/node_modules/prisma/prisma/. "$tmp_prisma_dir/"
            rm -rf .deploy-bundle/node_modules/prisma
            mkdir -p .deploy-bundle/node_modules/prisma
            cp -a "$tmp_prisma_dir/." .deploy-bundle/node_modules/prisma/
            rm -rf "$tmp_prisma_dir"
          fi

          tar -czf image-this-${GITHUB_SHA}.tar.gz -C .deploy-bundle .
          ls -lh image-this-${GITHUB_SHA}.tar.gz

      - name: Upload deployment bundle via rsync over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          rsync -avz --progress -e "ssh -i ~/.ssh/id_deploy -p $SERVER_PORT -o StrictHostKeyChecking=yes" \
            image-this-${GITHUB_SHA}.tar.gz scripts/deploy-standalone.sh \
            ${SERVER_USER}@${SERVER_HOST}:${APP_ROOT}/
          rm -f ~/.ssh/id_deploy

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 30m
          script: |
            mkdir -p ${{ env.APP_ROOT }}/scripts ${{ env.APP_ROOT }}/shared/data ${{ env.APP_ROOT }}/shared/public/uploads ${{ env.APP_ROOT }}/releases ${{ env.APP_ROOT }}/backups
            chmod +x ${{ env.APP_ROOT }}/deploy-standalone.sh
            cd ${{ env.APP_ROOT }}
            bash deploy-standalone.sh "${{ github.sha }}" "${{ env.APP_ROOT }}/image-this-${{ github.sha }}.tar.gz"

      - name: Verify deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          curl -f ${{ env.APP_DOMAIN }}/api/health
          echo "Deployment verification successful!"

      - name: Write deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Deployment Successful :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Environment | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Service URL | ${{ env.APP_DOMAIN }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Health Check | ${{ env.APP_DOMAIN }}/api/health |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Author | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Port | ${{ env.PORT }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deployment Failed :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Environment | Production |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Author | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
