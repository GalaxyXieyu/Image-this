name: Deploy to Production (Source Build)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_ROOT: /root/data/Image-this
  APP_DOMAIN: http://image.bojie.store
  APP_NAME: imagine-this-web
  PORT: '34123'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://image.bojie.store

    steps:
      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=()
          [ -z "$SERVER_HOST" ] && missing+=("SERVER_HOST")
          [ -z "$SERVER_USER" ] && missing+=("SERVER_USER")
          [ -z "$SERVER_SSH_KEY" ] && missing+=("SERVER_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Package source tarball
        run: |
          set -euxo pipefail
          git archive --format=tar.gz -o source-${GITHUB_SHA}.tar.gz HEAD
          ls -lh source-${GITHUB_SHA}.tar.gz

      - name: Upload source + deploy script via rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -p "$SERVER_PORT" -o StrictHostKeyChecking=yes \
            "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${APP_ROOT}"
          rsync -avz --progress -e "ssh -i ~/.ssh/id_deploy -p $SERVER_PORT -o StrictHostKeyChecking=yes" \
            source-${GITHUB_SHA}.tar.gz scripts/deploy-source.sh \
            ${SERVER_USER}@${SERVER_HOST}:${APP_ROOT}/
          rm -f ~/.ssh/id_deploy

      - name: Trigger server-side build & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 30m
          envs: APP_ROOT,APP_NAME,PORT
          script: |
            cd "${APP_ROOT}"
            chmod +x deploy-source.sh
            APP_ROOT="${APP_ROOT}" APP_NAME="${APP_NAME}" PORT="${PORT}" \
              bash deploy-source.sh "${{ github.sha }}" "${APP_ROOT}/source-${{ github.sha }}.tar.gz"

      - name: Verify public domain
        run: |
          echo "Waiting for service to be ready..."
          sleep 5
          curl -fsS ${{ env.APP_DOMAIN }}/api/health
          echo "Public health check passed!"

      - name: Write deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Production Deployment Successful :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Production Deployment Failed :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Strategy | Server-side build (npm ci + next build) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service URL | ${{ env.APP_DOMAIN }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health Check | ${{ env.APP_DOMAIN }}/api/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Author | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Port | ${{ env.PORT }} |" >> "$GITHUB_STEP_SUMMARY"
